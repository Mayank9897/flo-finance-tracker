<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flo — Sign In</title>

    <!-- Theme init (before paint, to avoid flash) -->
    <script>
        (function() {
            const saved = localStorage.getItem('flo-theme');
            const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .orb {
            position: fixed; border-radius: 50%;
            filter: blur(80px); opacity: 0.10; pointer-events: none;
            animation: float 8s ease-in-out infinite;
        }
        [data-theme="dark"] .orb { opacity: 0.14; }
        .orb-1 { width:500px;height:500px;background:radial-gradient(circle,var(--accent),transparent);top:-150px;left:-100px; }
        .orb-2 { width:400px;height:400px;background:radial-gradient(circle,#4a6a7a,transparent);bottom:-100px;right:-100px;animation-delay:-4s; }
        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            box-shadow: 0 30px 80px var(--shadow-color);
        }
        .btn-primary {
            width:100%; padding:12px;
            background: var(--accent);
            color:white; font-weight:700; font-size:14px;
            border:none; border-radius:12px; cursor:pointer;
            transition:all 0.2s;
            box-shadow: 0 4px 16px var(--accent-soft-strong);
        }
        .btn-primary:hover { background: var(--accent-strong); transform:translateY(-2px); box-shadow:0 8px 24px var(--accent-soft-strong); }
        .btn-primary:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
        .error-msg { color: var(--expense); font-size:13px; margin-top:6px; display:none; }
        .tab-btn { flex:1; padding:10px; border-radius:9px; font-size:13px; font-weight:600;
                   cursor:pointer; border:none; background:transparent; color: var(--text-secondary); transition:all 0.2s; }
        .tab-btn.active { background: var(--accent-soft); color: var(--accent-strong); border:1px solid var(--accent-soft-strong); }
        .tabs-wrap { background: var(--surface-hover); border: 1px solid var(--border); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center font-sans relative overflow-hidden" style="background:var(--bg); color:var(--text-primary)">

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="absolute top-5 right-5 z-20">
        <button class="theme-toggle" title="Toggle theme" onclick="toggleTheme()">
            <i data-lucide="sun" class="icon-sun w-4 h-4"></i>
            <i data-lucide="moon" class="icon-moon w-4 h-4"></i>
        </button>
    </div>

    <div class="login-card rounded-3xl p-8 w-full max-w-md mx-4 relative z-10">

        <!-- Logo -->
        <div class="flex items-center gap-3 mb-8 justify-center">
            <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:var(--accent)">
                <i data-lucide="zap" class="w-5 h-5 text-white"></i>
            </div>
            <div>
                <span class="text-2xl font-black" style="color:var(--text-primary)">Flo</span>
                <p class="text-xs -mt-0.5" style="color:var(--text-muted)">Finance Tracker</p>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs-wrap flex gap-2 p-1 rounded-xl mb-6">
            <button class="tab-btn active" id="loginTab" onclick="switchTab('login')">Sign In</button>
            <button class="tab-btn" id="registerTab" onclick="switchTab('register')">Create Account</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="space-y-4">
                <div>
                    <label class="form-label">Email</label>
                    <input type="email" id="loginEmail" placeholder="you@example.com" class="form-input" required>
                </div>
                <div>
                    <label class="form-label">Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" class="form-input" required>
                </div>
                <p class="error-msg" id="loginError"></p>
                <button type="submit" class="btn-primary mt-2" id="loginBtn">Sign In</button>
            </div>
        </form>

        <!-- Register Form -->
        <form id="registerForm" onsubmit="handleRegister(event)" style="display:none">
            <div class="space-y-4">
                <div>
                    <label class="form-label">Full Name</label>
                    <input type="text" id="regName" placeholder="Your name" class="form-input" required>
                </div>
                <div>
                    <label class="form-label">Email</label>
                    <input type="email" id="regEmail" placeholder="you@example.com" class="form-input" required>
                </div>
                <div>
                    <label class="form-label">Password</label>
                    <input type="password" id="regPassword" placeholder="Min 6 characters" class="form-input" required minlength="6">
                </div>
                <p class="error-msg" id="registerError"></p>
                <button type="submit" class="btn-primary mt-2" id="registerBtn">Create Account</button>
            </div>
        </form>

    </div>

    <script>
        lucide.createIcons();

        function toggleTheme() {
            const html = document.documentElement;
            const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('flo-theme', next);
        }

        function switchTab(tab) {
            document.getElementById('loginForm').style.display    = tab === 'login'    ? 'block' : 'none';
            document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
            document.getElementById('loginTab').classList.toggle('active',    tab === 'login');
            document.getElementById('registerTab').classList.toggle('active', tab === 'register');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const err = document.getElementById('loginError');
            err.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Signing in...';

            try {
                const res = await fetch('api/auth/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email:    document.getElementById('loginEmail').value,
                        password: document.getElementById('loginPassword').value
                    })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = 'index.html';
                } else {
                    err.textContent = data.error || 'Login failed';
                    err.style.display = 'block';
                }
            } catch {
                err.textContent = 'Network error. Is XAMPP running?';
                err.style.display = 'block';
            }

            btn.disabled = false;
            btn.textContent = 'Sign In';
        }

        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('registerBtn');
            const err = document.getElementById('registerError');
            err.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Creating account...';

            try {
                const res = await fetch('api/auth/register.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name:     document.getElementById('regName').value,
                        email:    document.getElementById('regEmail').value,
                        password: document.getElementById('regPassword').value
                    })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = 'index.html';
                } else {
                    err.textContent = data.error || 'Registration failed';
                    err.style.display = 'block';
                }
            } catch {
                err.textContent = 'Network error. Is XAMPP running?';
                err.style.display = 'block';
            }

            btn.disabled = false;
            btn.textContent = 'Create Account';
        }
    </script>
</body>
</html>
